server {
    listen 80 default_server;
    server_name _;

    location = /login {
        add_header WWW-Authenticate "Basic realm=network-forensics-lab" always;
        return 401 "authentication required\n";
    }

    location = /admin {
        return 200 "admin probe recorded\n";
    }

    location = /search {
        return 200 "query recorded\n";
    }

    location / {
        return 200 "network-forensics-lab victim\n";
    }
}
